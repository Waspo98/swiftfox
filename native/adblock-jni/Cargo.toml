[package]
name = "swiftfox_adblock"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[lib]
crate-type = ["cdylib"]

[dependencies]
adblock = { version = "=0.10.1", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
rmp = "<0.8.15"
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
